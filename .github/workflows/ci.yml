name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-and-notebooks:
    name: python-and-notebooks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate source catalog and integrity checks
        run: |
          python scripts/verificar_catalogo.py
          python -m unittest discover -s tests -p 'test_catalogo.py'

      - name: Validate tracked Python files and notebooks
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          checked_py = 0
          checked_notebooks = 0
          errors = []

          for raw_path in filter(None, tracked):
              path = pathlib.Path(raw_path.decode("utf-8", errors="surrogateescape"))
              if path.suffix == ".py":
                  try:
                      compile(path.read_bytes(), str(path), "exec")
                      checked_py += 1
                  except (SyntaxError, OSError, ValueError) as exc:
                      errors.append(f"{path}: {exc}")
              elif path.suffix == ".ipynb":
                  try:
                      notebook = json.loads(path.read_text(encoding="utf-8"))
                      if not isinstance(notebook, dict) or not isinstance(notebook.get("cells"), list):
                          raise ValueError("Invalid notebook: missing cells list")
                      checked_notebooks += 1
                  except (OSError, UnicodeError, ValueError) as exc:
                      errors.append(f"{path}: {exc}")

          print(f"Checked {checked_py} Python files and {checked_notebooks} notebooks.")
          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          PY

      - name: Verify preservation of historical experiments
        run: python scripts/verificar_legado.py

      - name: Test document extraction and agent contracts with synthetic data
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/finance-documents-venv"
          "${RUNNER_TEMP}/finance-documents-venv/bin/python" -m pip install --editable './packages/ai[documents,agents]'
          "${RUNNER_TEMP}/finance-documents-venv/bin/python" -m pip check
          "${RUNNER_TEMP}/finance-documents-venv/bin/python" scripts/exportar_schemas_agentes.py --check
          "${RUNNER_TEMP}/finance-documents-venv/bin/python" -m unittest discover -s tests

      - name: Test Chroma persistence with the vector extra
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/finance-vector-venv"
          VENV_PY="${RUNNER_TEMP}/finance-vector-venv/bin/python"
          # torch só para CPU: os testes simulam o encoder e não baixam pesos.
          "$VENV_PY" -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          "$VENV_PY" -m pip install --editable './packages/ai[vector]'
          "$VENV_PY" -m pip check
          "$VENV_PY" -m unittest discover -s tests -p 'test_vector_index.py' -v 2>&1 | tee "${RUNNER_TEMP}/vector-tests.log"
          if grep -q "skipped" "${RUNNER_TEMP}/vector-tests.log"; then
            echo "Testes de persistência Chroma foram pulados." >&2
            exit 1
          fi

      - name: Install and check the initial AI package in a clean environment
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/finance-base-venv"
          "${RUNNER_TEMP}/finance-base-venv/bin/python" -m pip install --editable ./packages/ai
          "${RUNNER_TEMP}/finance-base-venv/bin/python" -m pip check
          "${RUNNER_TEMP}/finance-base-venv/bin/python" -m finance_ai
          "${RUNNER_TEMP}/finance-base-venv/bin/finance-ai"

  backend:
    name: backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: grupo11_ci
          POSTGRES_USER: grupo11_ci
          POSTGRES_PASSWORD: senha-ficticia-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grupo11_ci -d grupo11_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DJANGO_SECRET_KEY: chave-ficticia-ci
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: grupo11_ci
      POSTGRES_USER: grupo11_ci
      POSTGRES_PASSWORD: senha-ficticia-ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Tesseract OCR for receipt extraction tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-por fonts-dejavu-core

      - name: Install backend dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Check Django configuration and pending model changes
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Apply migrations on a clean database
        run: |
          python manage.py migrate --noinput
          python manage.py migrate --check

      - name: Run backend tests
        run: python manage.py test
