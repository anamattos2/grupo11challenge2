[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grupo11-finance-ai"
version = "0.1.0"
description = "Base do pacote de IA do Desafio 02, Grupo 11"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = []

[project.scripts]
finance-ai = "finance_ai.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
